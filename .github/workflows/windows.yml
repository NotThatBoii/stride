name: Build Windows app
on:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'package*.json', 'index.html', 'vite.config.ts', 'tsconfig.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run desktop:build
      - name: Save Windows installer and standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: Stride-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/stride.exe
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 30
