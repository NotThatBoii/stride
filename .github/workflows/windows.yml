name: Build Windows app
on:
  push:
    branches: [main, codex/phase-6-hardening, codex/phase-7-release]
    tags: ["v*"]
    paths:
      [
        "src/**",
        "src-tauri/**",
        "config/**",
        "scripts/**",
        "docs/PORTABLE.txt",
        "docs/RELEASE-NOTES.md",
        "docs/TERMS_OF_SERVICE.md",
        "docs/DATA_AND_PRIVACY.md",
        "LICENSE",
        "public/**",
        "package*.json",
        "index.html",
        "vite.config.ts",
        "tsconfig.json",
        ".github/workflows/windows.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "src/**",
        "src-tauri/**",
        "config/**",
        "scripts/**",
        "docs/PORTABLE.txt",
        "docs/RELEASE-NOTES.md",
        "docs/TERMS_OF_SERVICE.md",
        "docs/DATA_AND_PRIVACY.md",
        "LICENSE",
        "public/**",
        "package*.json",
        "index.html",
        "vite.config.ts",
        "tsconfig.json",
        ".github/workflows/windows.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - artifact: Stride-Windows-x64
            config: ""
          - artifact: Stride-Windows-validation-x64
            config: config/native-validation.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:release-config
      - name: Inspect audited Rust dependencies on the Windows target
        shell: pwsh
        run: |
          $tree = @(cargo tree --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --prefix none --format '{p}')
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency tree inspection failed' }
          foreach ($package in @('glib v0.18.5', 'proc-macro-error v1.0.4')) {
            $reachable = @($tree | Where-Object { $_ -eq $package -or $_ -eq "$package (*)" }).Count -gt 0
            Write-Output "Audited package $package reachable on Windows target: $reachable"
            if ($reachable) { Write-Warning 'An audited package is reachable; review its advisory before release.' }
          }
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          node scripts/release-version.mjs $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata or tag verification failed' }
      - name: Build configured Windows app
        shell: pwsh
        env:
          STRIDE_NATIVE_CONFIG: ${{ matrix.config }}
        run: |
          if ($env:STRIDE_NATIVE_CONFIG) {
            npm run desktop:build -- --config $env:STRIDE_NATIVE_CONFIG
          } else {
            npm run desktop:build
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Prepare and verify Windows downloads
        shell: pwsh
        env:
          STRIDE_NATIVE_CONFIG: ${{ matrix.config }}
        run: ./scripts/package-windows.ps1 -NativeConfig $env:STRIDE_NATIVE_CONFIG
      - name: Check corrupt and incomplete downloads are rejected
        shell: pwsh
        env:
          STRIDE_NATIVE_CONFIG: ${{ matrix.config }}
        run: ./scripts/test-windows-artifacts.ps1 -Directory work/windows-distribution -NativeConfig $env:STRIDE_NATIVE_CONFIG
      - name: Save verified Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: work/windows-distribution/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Stride-Windows-x64
          path: windows-artifact
      - name: Publish Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/verify-windows-artifacts.ps1 -Directory windows-artifact -Version $version
          $assets = (Get-ChildItem -LiteralPath windows-artifact -File).FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Stride $version for Windows" --notes-file docs/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
