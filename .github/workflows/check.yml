name: Verify Stride
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:release-config
      - run: npm run test:consent-proposal
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:e2e:auth
      - run: npm run test:e2e:sync
      - run: npm run test:e2e:hardening
      - run: npm run test:e2e:recovery
      - run: npm run test:e2e:stress
      - run: npm run test:e2e:performance
      - run: npm run test:e2e:pwa
